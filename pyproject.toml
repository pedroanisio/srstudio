[project]
name = "srstudio"
version = "0.1.0"
description = "Reusable cast, locations, props, graphics and episode builder for scene-render, on the sr-core scene SDK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["sr-core @ git+https://github.com/pedroanisio/sr-core", "shapely>=2.1,<3"]

[project.optional-dependencies]
validate = ["sr-core[validate]"]   # level-2 checks (XSD + Schematron through lxml)
fast = ["numpy"]                  # legacy extra; Shapely also installs NumPy
test = ["pytest", "pytest-cov", "ruff", "mypy", "types-shapely"]

[project.scripts]
srstudio = "srstudio.cli:main"
scene-render-provider-srstudio-elevenlabs = "srstudio.provider:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
srstudio = ["assets/**/*"]  # read through importlib.resources: Toon's traced cat, DejaVu's licence notice

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "episodes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["srstudio"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["srstudio"]

[tool.coverage.report]
fail_under = 80

[tool.ruff.format]
# Markdown examples are hand-aligned for reading; the formatter owns Python sources only.
exclude = ["*.md"]
quote-style = "preserve"
skip-magic-trailing-comma = true
